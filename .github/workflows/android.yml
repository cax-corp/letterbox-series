name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # The action's default includes the removed legacy "tools" package.
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - run: npm run android:sync
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TMDB_READ_TOKEN: ${{ secrets.VITE_TMDB_READ_TOKEN }}
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vela-robolectric-sdks
          key: robolectric-4.14.1-android-9-14-15-i7
      - name: Prepare verified Android test runtimes
        run: python3 scripts/prepare-robolectric-sdks.py --output "$RUNNER_TEMP/vela-robolectric"
      - run: bash ./gradlew testDebugUnitTest --no-daemon --max-workers=2
        working-directory: android
        env:
          VELA_ROBOLECTRIC_SDK_DIR: ${{ runner.temp }}/vela-robolectric
      - name: Android test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Vela-Android-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - name: Check persistent signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.VELA_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VELA_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VELA_ANDROID_KEY_ALIAS }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Release APK skipped. Configure the persistent Vela signing secrets; see docs/signature-android.md.'
          fi
      - name: Restore private keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.VELA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'vela-release.p12'
          p.write_bytes(base64.b64decode(''.join(os.environ['KEYSTORE_BASE64'].split()),validate=True))
          p.chmod(0o600)
          PY
      - name: Build signed release
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          VELA_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/vela-release.p12
          VELA_ANDROID_STORE_PASSWORD: ${{ secrets.VELA_ANDROID_STORE_PASSWORD }}
          VELA_ANDROID_KEY_ALIAS: ${{ secrets.VELA_ANDROID_KEY_ALIAS }}
        run: bash ./gradlew assembleRelease --no-daemon --max-workers=2
      - name: Verify release certificate
        if: steps.signing.outputs.ready == 'true'
        run: node scripts/verify-apk-signature.mjs android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: Vela-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Remove private keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/vela-release.p12"
