<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B141B" />
    <meta
      name="description"
      content="Vela — votre vie en films et en séries. Explorez, notez et gardez une trace des histoires qui vous marquent."
    />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <script>
      try {
        const t = localStorage.getItem("luma-theme");
        document.documentElement.dataset.theme =
          t === "light" ||
          (t === "system" &&
            matchMedia("(prefers-color-scheme: light)").matches)
            ? "light"
            : "dark";
      } catch {}
    </script>
    <title>Vela — Les histoires restent.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
